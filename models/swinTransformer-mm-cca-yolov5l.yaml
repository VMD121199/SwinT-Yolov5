# Parameters
nc: 80 # number of classes
ch: 4 # no. input channel
depth_multiple: 1.0 # model depth multiple
width_multiple: 1.0 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

#Custom backbone
backbone:
  # [from, number, module, args]
  # input [b, 1, 512, 512]                  #Custom
  [
    [-1, 1, CrossChannelAttention, [16, 4, 4]], #0
    [-1, 1, PatchEmbed, [128, 4]], #1 [b, 128, 128, 128]
    [-1, 1, SwinTransformer, [128, 2, 4, 16]], #2 [b, 128, 128, 128] *args: [c2, depth, num_heads, window_size]
    [-1, 1, PatchMerging, [256]], #3 [b, 256, 64, 64]
    [-1, 1, SwinTransformer, [256, 2, 8, 16]], #4 [b, 256, 64, 64]
    [-1, 1, PatchMerging, [512]], #5 [b, 512, 32, 32]
    [-1, 1, SwinTransformer, [512, 18, 16, 16]], #6 [b, 512, 32, 32]
    [-1, 1, PatchMerging, [1024]], #7 [b, 1024, 16, 16]
    [-1, 1, SwinTransformer, [1024, 2, 32, 16]], #8 [b, 1024, 16, 16]
  ]

# YOLOv5 v6.0 head
head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]], # cat backbone P4
    [-1, 3, C3, [512, False]], # 12

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 3], 1, Concat, [1]], # cat backbone P3
    [-1, 3, C3, [256, False]], # 16 (P3/8-small)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 13], 1, Concat, [1]], # cat head P4
    [-1, 3, C3, [512, False]], # 19 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 9], 1, Concat, [1]], # cat head P5
    [-1, 3, C3, [1024, False]], # 22 (P5/32-large)

    [[16, 19, 22], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]
